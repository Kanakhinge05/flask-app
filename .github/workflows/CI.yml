name: CI - Build & test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build step
        run: |
          echo "Building application"
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # Automatically caches dependencies for faster workflows

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test step
        run: |
          echo "Running tests"

      - name: Run tests
        run: |
          pytest tests/test_app.py

      - name: test step
        run: |
          echo "Tests completed"